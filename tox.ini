[tox]
envlist =
    lint,
    py31{1,2,3,4,5},

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, lint
    3.15: py315

[testenv]
deps =
    pytest
    pytest-cov
    pytest-recording
commands = pytest --cov=jellyash {posargs}
passenv = COVERAGE_FILE

[testenv:lint]
basepython = python3.14
skip_install = true
deps =
    ruff
commands =
    ruff check --exit-non-zero-on-fix jellyash tests
    ruff format --diff jellyash tests

